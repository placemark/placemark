name: Node CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      VITE_PUBLIC_GEOCODE_EARTH_TOKEN: xxx
      WFC_QUOTA: 10
      WFC_QUOTA_ENTERPRISE: 100
      TEAM_EMAIL: foo@bar.com
      DOMAIN: test.local
      GITHUB_CLIENT_ID: xx
      GITHUB_CLIENT_SECRET: xx
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install packages
        run: |
          pnpm i
      - name: Lint
        run: |
          pnpm lint
      - name: TSC
        run: |
          pnpm tsc
      - name: Run tests with coverage
        run: |
          pnpm test
      - name: Install atproto-persistence worker dependencies
        run: |
          pnpm --dir workers/atproto-persistence install --frozen-lockfile
      - name: Typecheck and test atproto-persistence worker
        run: |
          pnpm --dir workers/atproto-persistence exec tsc --noEmit
          pnpm --dir workers/atproto-persistence test
